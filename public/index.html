
<script>
  // API key is entered by the operator and held in memory only.
  let API_KEY = '';

  const $ = (id) => document.getElementById(id);

  let allSlots = [];
  let chosen = null;
  let current = null;
  let attemptKey = null;

  async function api(method, path, body, extraHeaders) {
    const res = await fetch(path, {
      method,
      headers: Object.assign(
        {
          'X-API-Key': API_KEY,
          'Content-Type': 'application/json'
        },
        extraHeaders || {}
      ),
      body: body ? JSON.stringify(body) : undefined,
    });

    let data = {};
    try {
      data = await res.json();
    } catch (e) {}

    if (!res.ok) {
      const err = new Error(data.error || 'Something went wrong');
      err.status = res.status;
      err.retryAfter = res.headers.get('Retry-After');
      throw err;
    }

    return data;
  }

  function showError(msg) {
    const el = $('error');
    el.textContent = msg;
    el.classList.toggle('hidden', !msg);
  }

  function fmt(iso) {
    return new Date(iso).toLocaleString(undefined, {
      weekday: 'short',
      day: 'numeric',
      month: 'short',
      hour: '2-digit',
      minute: '2-digit'
    });
  }

  function renderProviders() {
    const sel = $('provider');
    const keep = sel.value;

    const providers = [
      ...new Set(allSlots.map((s) => s.provider))
    ].sort();

    sel.innerHTML = '';
    sel.appendChild(new Option('All providers', ''));

    providers.forEach((p) => {
      sel.appendChild(new Option(p, p));
    });

    sel.value = providers.includes(keep) ? keep : '';
  }

  function renderSlots() {
    const box = $('slots');
    const provider = $('provider').value;

    const list = allSlots.filter(
      (s) => !provider || s.provider === provider
    );

    box.textContent = '';

    if (list.length === 0) {
      box.textContent = 'No slots to show.';
      return;
    }

    list.forEach((s) => {
      const card = document.createElement('div');
      card.className = 'slot' + (s.available ? '' : ' booked');

      const prov = document.createElement('div');
      prov.className = 'prov';
      prov.textContent = s.provider;

      const when = document.createElement('div');
      when.className = 'when';
      when.textContent =
        fmt(s.start) + ' – ' +
        new Date(s.end).toLocaleTimeString(undefined, {
          hour: '2-digit',
          minute: '2-digit'
        });

      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = s.available ? 'Book' : 'Taken';
      btn.disabled = !s.available;
      btn.addEventListener('click', () => pick(s));

      card.append(prov, when, btn);
      box.appendChild(card);
    });
  }

  async function loadSlots() {
    try {
      showError('');

      const data = await api('GET', '/slots');

      allSlots = data.slots;
      renderProviders();
      renderSlots();

      return true;
    } catch (e) {
      $('slots').textContent = '';
      showError('Could not load slots: ' + e.message);
      return false;
    }
  }

  // API key connection
  $('accessForm').addEventListener('submit', async (ev) => {
    ev.preventDefault();

    API_KEY = $('apiKey').value.trim();

    if (!API_KEY) return;

    $('slots').textContent = 'Connecting...';

    const connected = await loadSlots();

    if (!connected) {
      API_KEY = '';
      $('slots').textContent =
        'Enter a valid API key to load appointment times.';
      return;
    }

    $('accessPanel').classList.add('hidden');
    $('bookingToolbar').classList.remove('hidden');
    $('apiKey').value = '';
  });

  function pick(slot) {
    chosen = slot;
    attemptKey = null;

    $('confirmPanel').classList.add('hidden');

    $('chosen').textContent =
      slot.provider + ' · ' + fmt(slot.start);

    $('bookPanel').classList.remove('hidden');
    $('name').focus();

    window.scrollTo({
      top: 0,
      behavior: 'smooth'
    });
  }

  // Provider filter and refresh
  $('provider').addEventListener('change', renderSlots);

  $('refresh').addEventListener('click', loadSlots);

  $('cancelPick').addEventListener('click', () => {
    $('bookPanel').classList.add('hidden');
    chosen = null;
  });

  $('bookAnother').addEventListener('click', () => {
    $('confirmPanel').classList.add('hidden');
    loadSlots();
  });

  // Submit a booking
  $('bookForm').addEventListener('submit', async (ev) => {
    ev.preventDefault();

    showError('');

    const name = $('name').value.trim();
    const email = $('email').value.trim();

    if (!name) {
      return showError('Please enter your name.');
    }

    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      return showError('Please enter a valid email address.');
    }

    if (!chosen) {
      return showError('Please choose a time slot first.');
    }

    if (!attemptKey) {
      attemptKey = crypto.randomUUID();
    }

    $('submitBtn').disabled = true;

    try {
      const booking = await api(
        'POST',
        '/bookings',
        {
          slot_id: chosen.id,
          name,
          email
        },
        {
          'Idempotency-Key': attemptKey
        }
      );

      current = booking;

      $('cId').textContent = booking.id;
      $('cStatus').textContent = booking.status;
      $('cName').textContent = booking.name;
      $('cEmail').textContent = booking.email;

      $('cWhen').textContent =
        chosen.provider + ' · ' + fmt(chosen.start);

      $('confirmTitle').textContent = 'Booking confirmed';

      $('cancelBooking').classList.remove('hidden');
      $('bookPanel').classList.add('hidden');
      $('confirmPanel').classList.remove('hidden');

      $('bookForm').reset();

      chosen = null;
      attemptKey = null;

      await loadSlots();

    } catch (e) {
      if (e.status === 409) {
        showError(
          'Sorry, that slot was just taken. Please pick another time.'
        );

        attemptKey = null;
        await loadSlots();

      } else if (e.status === 429) {
        showError(
          'Too many attempts. Please wait ' +
          (e.retryAfter || 'a moment') +
          ' seconds and try again.'
        );

      } else {
        showError(e.message);
      }

    } finally {
      $('submitBtn').disabled = false;
    }
  });

  // Cancel an existing booking
  $('cancelBooking').addEventListener('click', async () => {
    if (!current) return;

    $('cancelBooking').disabled = true;

    try {
      const b = await api(
        'DELETE',
        '/bookings/' + encodeURIComponent(current.id)
      );

      $('cStatus').textContent = b.status;
      $('confirmTitle').textContent = 'Booking cancelled';

      $('cancelBooking').classList.add('hidden');

      await loadSlots();

    } catch (e) {
      showError(e.message);

    } finally {
      $('cancelBooking').disabled = false;
    }
  });

  // Initial page state: wait for API key.
  $('slots').textContent =
    'Enter your API key above to view available appointment times.';
</script>
